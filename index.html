<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonic DOOM Special Stage</title>
<style>
  :root {
    --bg: #000;
    --fg: #e8e8e8;
    --accent: #d22b2b;
    --muted: #9a9a9a;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }
  canvas#screen {
    display: block;
    image-rendering: pixelated;
    width: min(100vw, calc(100vh * 4 / 3));
    aspect-ratio: 4 / 3;
    background: #000;
  }
  #files {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(0, 0, 0, 0.92);
  }
  #files.show { display: grid; }
  .panel {
    max-width: 560px;
    margin: 16px;
    padding: 24px;
    border: 2px solid var(--accent);
    background: #111;
    line-height: 1.5;
  }
  .panel h1 { margin: 0 0 8px; font-size: 20px; color: var(--accent); }
  .panel ul { padding-left: 20px; }
  .panel li.ok { color: #6fdc6f; }
  .drop {
    margin-top: 12px;
    padding: 18px;
    border: 2px dashed var(--muted);
    text-align: center;
    color: var(--muted);
  }
  .drop.hover { border-color: var(--fg); color: var(--fg); }
  #status {
    position: fixed;
    left: 8px;
    bottom: 6px;
    font-size: 12px;
    color: var(--muted);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="1195" height="896"></canvas></div>
<div id="files">
  <div class="panel">
    <h1>Load your game files</h1>
    <div>This game reads graphics, levels and music from your own copies of:</div>
    <ul id="need">
      <li id="need-rom">Sonic the Hedgehog 2 (REV01 / "Rev A") Mega Drive ROM</li>
      <li id="need-doom">DOOM.WAD (The Ultimate DOOM or DOOM)</li>
      <li id="need-doom2">DOOM2.WAD (optional)</li>
    </ul>
    <div class="drop" id="drop">Drop the files here, or <label style="text-decoration:underline;cursor:pointer">choose files<input id="pick" type="file" multiple hidden></label></div>
  </div>
</div>
<div id="status"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
